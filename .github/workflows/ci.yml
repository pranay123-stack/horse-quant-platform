name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests scripts
      - run: ruff format --check backend tests scripts
      - run: mypy backend

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: horse_quant
          POSTGRES_PASSWORD: horse_quant
          POSTGRES_DB: horse_quant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U horse_quant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: "5432"
        run: pytest --cov=backend --cov-report=xml --cov-report=term-missing

      - name: Enforce coverage floor
        run: coverage report --fail-under=90

      - name: Check migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg2://horse_quant:horse_quant@localhost:5432/horse_quant
        run: |
          alembic upgrade head
          alembic downgrade base

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: horse-quant-platform-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run --rm -d --name hqp-ci -p 8000:8000 horse-quant-platform-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break || sleep 2
          done
          docker rm -f hqp-ci
