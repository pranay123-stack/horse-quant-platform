; Alembic configuration.
; The database URL is intentionally absent here -- migrations/env.py reads it
; from backend.utils.config so credentials live only in .env / the environment.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
timezone = UTC

# Migration filenames: 2026_08_09_1430-ab12cd34ef56_add_races_table.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

; Autogenerated revisions are formatted on the way out.
; `exec` (not `console_scripts`) because ruff ships a standalone binary and
; declares no console_scripts entry point.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
